<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <script>
        window.MathJax = {
            svg: {blacker: 5}
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div id="energy-label"></div>
    <div id="equation-label" style="display: none;"></div>
    <div id="symbols" style="display: none;"></div>
    <script src="mechsim.js"></script>
    <script>
        function drawSystem(params) {
            const theta1 = params[0];
            const theta2 = params[1];
            ctx.resetTransform();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(canvas.width / 3, canvas.height / 2);

            drawAxis();
            drawAngle(-theta1);
            moveLabel("t1", 20, -10);
            ctx.rotate(-theta1);
            drawBar();
            drawHinge();
            moveLabel("l1", 15, 50);
            ctx.translate(0, 100);
            ctx.rotate(theta1);

            drawMass();
            moveLabel("m1", -25, 0);

            drawAxis();
            drawAngle(-theta2);
            moveLabel("t2", 25, -10);
            ctx.rotate(-theta2);
            drawBar();
            drawHinge();
            moveLabel("l2", -15, 50);
            ctx.translate(0, 100);
            ctx.rotate(theta2);

            drawMass();
            moveLabel("m2", 25, 0);
        }

        symbolContainer.innerText = `\(\theta_1\) \(l_1\) \(m_1\) \(\theta_2\) \(l_2\) \(m_2\)`;
    </script>
    <script type="mpy" src="pend.py" config="mechsim-conf.json"></script>
</body>
</html>
